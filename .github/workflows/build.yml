name: Windows portable EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: DLPapp-Windows-x64
          path: |
            dist/DLPapp.exe
            dist/DLPapp.exe.sha256
