name: CLI packages
on:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # If this project is at cli/ in the GUI repo, add job defaults:
    # defaults:
    #   run:
    #     working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
      - run: dlpapp --version
      - run: dlpapp --help
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: cli-python-${{ matrix.os }}
          # Change to cli/dist/* for a cli/ subdirectory.
          path: dist/*
  deb:
    runs-on: ubuntu-latest
    # Add the same working-directory defaults if copied into cli/.
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: cli-debian
          path: dist/*.deb
